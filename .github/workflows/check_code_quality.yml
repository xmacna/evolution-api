name: Check Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evolution_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: evolution_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evolution_test -d evolution_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution_test:local_ci_only@127.0.0.1:5432/evolution_test
      XMACNA_INBOX_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run test:xmacna-compat
      - run: npm run test:xmacna-inbox
      - name: Prepare isolated PostgreSQL schema
        run: npx prisma db push --schema prisma/postgresql-schema.prisma --skip-generate
      - run: npm run test:xmacna-inbox:postgres
      - run: npm run build
